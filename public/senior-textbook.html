<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高中英语 · 课本章节同步训练</title>
<style>
  :root { --brand:#6b46c1; --brand2:#8b5cf6; --ok:#2a8; --err:#e23; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#f3f5fb; color:#222; }
  .wrap { max-width:1000px; margin:0 auto; padding:16px; }
  .topbar { background:linear-gradient(135deg,#6b46c1,#8b5cf6); color:#fff; padding:16px; border-radius:16px; margin-bottom:14px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .topbar h1 { font-size:19px; }
  .topbar .sub { font-size:12px; opacity:.92; margin-top:3px; }
  .topbar .spacer { flex:1; }
  .topbar a.back { color:#fff; text-decoration:none; background:rgba(255,255,255,.22); padding:7px 14px; border-radius:20px; font-size:13px; }
  .trial-note { background:#fffbe8; border:1px solid #f3e6b8; color:#7a5c00; padding:10px 14px; border-radius:12px; font-size:13px; margin-bottom:14px; display:none; }
  .wx-card { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:10px; background:#fff; border:1px dashed #d8c98a; border-radius:10px; padding:10px 12px; font-size:13px; color:#444; }
  .wx-card b { color:#6b46c1; font-size:15px; }
  .wx-card img { width:120px; height:auto; border-radius:8px; display:block; }
  .layout { display:flex; gap:14px; align-items:flex-start; }
  .side { width:250px; flex-shrink:0; background:#fff; border-radius:16px; padding:14px; box-shadow:0 4px 16px rgba(0,0,0,.05); max-height:80vh; overflow-y:auto; }
  .side h3 { font-size:12px; color:#999; margin:14px 0 8px; font-weight:700; }
  .side h3:first-child { margin-top:0; }
  .bk-tab { display:inline-block; padding:6px 10px; border-radius:10px; font-size:12.5px; cursor:pointer; margin:0 4px 6px 0; background:#f1ecfb; color:#6b46c1; font-weight:700; }
  .bk-tab.on { background:#6b46c1; color:#fff; }
  .unit-item { padding:9px 11px; border-radius:10px; cursor:pointer; border:1.5px solid transparent; margin-bottom:5px; font-size:13px; line-height:1.4; }
  .unit-item:hover { background:#f1ecfb; }
  .unit-item.on { background:#f1ecfb; border-color:var(--brand,#6b46c1); font-weight:700; }
  .unit-item .s { font-size:11px; color:#999; margin-top:2px; }
  .main { flex:1; min-width:0; }
  .card { background:#fff; border-radius:16px; padding:20px; box-shadow:0 4px 16px rgba(0,0,0,.05); margin-bottom:14px; }
  .card h2 { font-size:17px; margin-bottom:4px; }
  .card .topic { font-size:13px; color:#888; margin-bottom:12px; }
  .sec-title { font-size:15px; font-weight:800; color:var(--brand,#6b46c1); margin:18px 0 10px; display:flex; align-items:center; gap:8px; }
  .sec-title .num { background:var(--brand,#6b46c1); color:#fff; border-radius:8px; font-size:12px; padding:2px 8px; }
  .wgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; }
  .wcard { border:1px solid #eef0f5; border-radius:12px; padding:12px; }
  .wcard .tw { display:flex; align-items:center; justify-content:space-between; }
  .wcard .w { font-size:20px; font-weight:800; }
  .wcard .ph { font-size:12px; color:#888; margin-top:2px; }
  .wcard .pos { display:inline-block; background:#f1ecfb; color:#6b46c1; font-size:11px; padding:1px 7px; border-radius:7px; margin-top:4px; }
  .wcard .m { font-size:14px; color:#333; margin-top:6px; font-weight:600; }
  .wcard .ex { font-size:11.5px; color:#777; margin-top:6px; line-height:1.5; }
  .wcard .play { width:34px; height:34px; border-radius:50%; border:none; background:linear-gradient(135deg,#6b46c1,#8b5cf6); color:#fff; font-size:15px; cursor:pointer; flex-shrink:0; }
  .gpoint { border-left:3px solid var(--brand,#6b46c1); background:#f8faff; padding:10px 12px; border-radius:0 10px 10px 0; margin-bottom:10px; }
  .gpoint .gt { font-weight:700; font-size:14px; margin-bottom:4px; }
  .gpoint .gd { font-size:13px; color:#444; line-height:1.6; }
  .gpoint .ge { font-size:12.5px; color:#555; margin-top:5px; }
  .gpoint .ge .en { color:var(--brand,#6b46c1); font-style:italic; }
  .qitem { border:1px solid #eef0f5; border-radius:12px; padding:14px; margin-bottom:12px; }
  .qitem .qh { font-size:14px; font-weight:700; margin-bottom:10px; }
  .qopt { padding:11px 13px; border:1.5px solid #eee; border-radius:10px; margin:7px 0; font-size:14px; cursor:pointer; }
  .qopt:hover { border-color:var(--brand,#6b46c1); }
  .qopt.right { background:#e8f8ee; border-color:var(--ok,#2a8); }
  .qopt.wrong { background:#fdecea; border-color:var(--err,#e23); }
  .qopt.locked { pointer-events:none; }
  .qres { margin-top:8px; font-size:13px; font-weight:700; display:none; }
  .qres.ok { color:#2a8; display:block; }
  .qres.bad { color:#e23; display:block; }
  .qana { margin-top:6px; font-size:12.5px; color:#666; line-height:1.6; display:none; }
  .qana.show { display:block; }
  .empty { background:#fff; border-radius:16px; padding:60px 20px; text-align:center; color:#b0b0b0; font-size:15px; box-shadow:0 4px 16px rgba(0,0,0,.05); }
  .coming { background:#fff; border-radius:16px; padding:40px 20px; text-align:center; color:#9aa; font-size:15px; box-shadow:0 4px 16px rgba(0,0,0,.05); }
  .err-msg { color:#e23; font-size:14px; text-align:center; padding:30px 10px; }
  @media (max-width:720px) {
    .layout { flex-direction:column; }
    .side { width:100%; max-height:none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1>📘 高中英语 · 课本章节同步训练</h1>
      <div class="sub">人教版（2019 版）必修 + 选择性必修 · 词汇 + 语法 + 同步练习</div>
    </div>
    <div class="spacer"></div>
    <a class="back" href="./gaokao.html">🎓 高考英语</a>
    <a class="back" href="./index.html">← 返回主页</a>
    <a class="back" style="cursor:pointer;" onclick="logout()">退出登录</a>
  </div>
  <div class="trial-note" id="trialNote"></div>

  <div class="layout">
    <div class="side">
      <h3>选择册与单元</h3>
      <div id="bookTabs"></div>
      <div id="unitList"><div class="empty" style="box-shadow:none;padding:18px;">加载中…</div></div>
    </div>
    <div class="main" id="mainArea"><div class="empty">请选择左侧单元开始学习</div></div>
  </div>
</div>

<script>
function logout(){ try{localStorage.removeItem('token')}catch(e){} location.href='./index.html'; }
(function () {
  const $ = s => document.querySelector(s);
  const TOKEN = localStorage.getItem('token') || '';
  let DEVFP = '';
  try { DEVFP = localStorage.getItem('devfp') || ''; } catch (e) {}
  const H = () => ({ 'Content-Type': 'application/json', 'X-Device': DEVFP, ...(TOKEN ? { Authorization: TOKEN } : {}) });
  let BOOKS = [];
  let curUnit = null;
  let curBookCode = null;

  async function api(path) {
    const ctl = new AbortController();
    const tm = setTimeout(() => ctl.abort(), 12000);
    try {
      const r = await fetch(path, { headers: H(), signal: ctl.signal });
      const j = await r.json().catch(() => ({}));
      return { s: r.status, j };
    } catch (e) { return { s: 0, j: { error: '网络异常或请求超时，请检查网络后重试' } }; }
    finally { clearTimeout(tm); }
  }
  function play(id) { try { const a = new Audio(id); a.play(); } catch (e) {} }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  async function init() {
    const r = await api('/api/senior-textbook');
    if (r.s === 0) { $('#unitList').innerHTML = '<div class="empty" style="box-shadow:none;padding:14px;">网络异常 <button onclick="location.reload()" style="margin-left:8px;padding:4px 10px;border:none;border-radius:8px;background:#6b46c1;color:#fff;cursor:pointer;">重试</button></div>'; $('#mainArea').innerHTML = '<div class="err-msg">' + (r.j.error || '加载失败') + '</div>'; return; }
    if (r.s === 401) { $('#mainArea').innerHTML = '<div class="err-msg">请先登录：<a href="./index.html" style="color:#6b46c1;">前往登录页</a></div>'; $('#unitList').innerHTML = '<div class="empty" style="box-shadow:none;padding:14px;">未登录</div>'; return; }
    BOOKS = (r.j && r.j.books) || [];
    if (!BOOKS.length) { $('#unitList').innerHTML = '<div class="empty" style="box-shadow:none;padding:14px;">暂无数据</div>'; return; }
    if (r.j.trial) {
      $('#trialNote').style.display = 'block';
      $('#trialNote').innerHTML = '🎁 体验模式：可学习 <b>必修第一册 Welcome Unit</b>（高中英语入门单元）。输入授权码或联系管理员授权，即可解锁全部 36 个单元。<div class="wx-card">需要解锁或购买，请添加管理员微信：<b>13538237315</b><a href="./assets/admin-wechat-qr.jpg" target="_blank"><img src="./assets/admin-wechat-qr.jpg" alt="管理员微信二维码"></a></div>';
    }
    curBookCode = BOOKS[0].code;
    renderBookTabs();
    renderUnits(BOOKS[0]);
    loadUnit(BOOKS[0].units[0].id);
  }

  function renderBookTabs() {
    $('#bookTabs').innerHTML = BOOKS.map(b =>
      '<span class="bk-tab' + (b.code === curBookCode ? ' on' : '') + '" data-c="' + b.code + '">' + esc(b.title) + '</span>').join('');
    document.querySelectorAll('.bk-tab').forEach(el => el.addEventListener('click', () => {
      curBookCode = el.dataset.c; renderBookTabs();
      renderUnits(BOOKS.find(b => b.code === curBookCode));
    }));
  }
  function renderUnits(book) {
    const items = book.units.map(u => {
      const on = curUnit && curUnit.id === u.id ? ' on' : '';
      const cnt = (u.words || 0) + (u.grammars || 0) + (u.questions || 0);
      const sub = cnt > 0 ? ((u.words || 0) + ' 词 · ' + (u.grammars || 0) + ' 语法 · ' + (u.questions || 0) + ' 题') : '📝 内容整理中';
      return '<div class="unit-item' + on + '" data-u="' + u.id + '"><div>' + esc(u.title) + '</div>' +
        '<div class="s">' + sub + '</div></div>';
    }).join('');
    $('#unitList').innerHTML = items;
    document.querySelectorAll('.unit-item').forEach(el => el.addEventListener('click', () => {
      document.querySelectorAll('.unit-item').forEach(x => x.classList.remove('on'));
      el.classList.add('on'); loadUnit(el.dataset.u);
    }));
  }

  async function loadUnit(uid) {
    const r = await api('/api/senior-textbook?unit=' + uid);
    if (r.s === 0) { $('#mainArea').innerHTML = '<div class="err-msg">' + (r.j.error || '网络异常') + ' <button onclick="location.reload()" style="margin-left:8px;padding:4px 10px;border:none;border-radius:8px;background:#6b46c1;color:#fff;cursor:pointer;">重试</button></div>'; return; }
    if (r.s !== 200 || !r.j) { $('#mainArea').innerHTML = '<div class="err-msg">加载失败（' + r.s + '）</div>'; return; }
    curUnit = r.j;
    renderUnit();
  }

  function renderUnit() {
    const u = curUnit;
    const hasContent = (u.words && u.words.length) || (u.grammars && u.grammars.length) || (u.questions && u.questions.length);
    let h = '<div class="card"><h2>' + esc(u.title) + '</h2><div class="topic">主题：' + esc(u.topic) + '</div>';
    if (!hasContent) {
      h += '<div class="coming">📝 本单元内容整理中，即将上线，敬请期待。</div></div>';
      $('#mainArea').innerHTML = h;
      return;
    }
    // 词汇
    if (u.words && u.words.length) {
      h += '<div class="sec-title"><span class="num">' + u.words.length + '</span> 重点词汇</div><div class="wgrid">';
      h += u.words.map(w => {
        return '<div class="wcard"><div class="tw"><div><div class="w">' + esc(w.word) + '</div><div class="ph">' + esc(w.phonetic) + '</div></div>' +
          '<button class="play" data-a="' + esc(w.audio || '') + '">▶</button></div>' +
          (w.pos ? '<span class="pos">' + esc(w.pos) + '</span>' : '') +
          '<div class="m">' + esc(w.meaning) + '</div>' +
          (w.sentence ? '<div class="ex">📌 ' + esc(w.sentence) + '<br>' + esc(w.sentenceCn || '') + '</div>' : '') +
          '</div>';
      }).join('');
      h += '</div></div>';
    } else {
      h += '<div class="sec-title"><span class="num">0</span> 重点词汇</div><div class="coming" style="padding:18px;">词汇整理中</div>';
    }
    // 语法要点
    if (u.grammars && u.grammars.length) {
      h += '<div class="card"><div class="sec-title"><span class="num">' + u.grammars.length + '</span> 语法要点</div>';
      h += u.grammars.map(gr => '<div class="gpoint"><div class="gt">' + esc(gr.point) + '</div>' +
        '<div class="gd">' + esc(gr.example || '') + '</div>' +
        (gr.exampleCn ? '<div class="ge"><span class="en">译文：</span>' + esc(gr.exampleCn) + '</div>' : '') +
        '</div>').join('');
      h += '</div>';
    } else {
      h += '<div class="card"><div class="sec-title"><span class="num">0</span> 语法要点</div><div class="coming" style="padding:18px;">语法整理中</div></div>';
    }
    // 同步练习
    if (u.questions && u.questions.length) {
      h += '<div class="card"><div class="sec-title"><span class="num">' + u.questions.length + '</span> 同步练习</div>';
      h += u.questions.map((q, qi) => {
        return '<div class="qitem" data-q="' + qi + '"><div class="qh">' + (qi + 1) + '. ' + esc(q.stem) + '</div>' +
          q.options.map((o, oi) => '<div class="qopt" data-o="' + oi + '">' + esc(o) + '</div>').join('') +
          '<div class="qres" id="qres' + qi + '"></div>' +
          '<div class="qana" id="qana' + qi + '">💡 ' + esc(q.analysis || '') + '</div></div>';
      }).join('');
      h += '</div>';
    } else {
      h += '<div class="card"><div class="sec-title"><span class="num">0</span> 同步练习</div><div class="coming" style="padding:18px;">练习整理中</div></div>';
    }
    $('#mainArea').innerHTML = h;
    // 绑定
    document.querySelectorAll('.wcard .play').forEach(b => b.addEventListener('click', () => { if (b.dataset.a) play(b.dataset.a); }));
    document.querySelectorAll('.qitem').forEach(item => {
      const qi = Number(item.dataset.q);
      const q = u.questions[qi];
      item.querySelectorAll('.qopt').forEach(opt => opt.addEventListener('click', () => {
        if (item.querySelector('.qres').classList.contains('ok') || item.querySelector('.qres').classList.contains('bad')) return;
        const oi = Number(opt.dataset.o);
        const ok = oi === q.answer;
        item.querySelectorAll('.qopt').forEach(x => x.classList.add('locked'));
        if (ok) { opt.classList.add('right'); } else { opt.classList.add('wrong'); item.querySelectorAll('.qopt').forEach(x => { if (Number(x.dataset.o) === q.answer) x.classList.add('right'); }); }
        const res = item.querySelector('#qres' + qi);
        res.textContent = ok ? '✅ 回答正确！' : '❌ 正确答案：' + esc(q.options[q.answer]);
        res.className = 'qres ' + (ok ? 'ok' : 'bad');
        item.querySelector('#qana' + qi).classList.add('show');
      }));
    });
  }

  init();
})();
</script>
</body>
</html>
