<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幼儿启蒙英语 · 儿歌磨耳朵</title>
<style>
  :root { --brand:#ff9f43; --brand2:#ffbe76; --ok:#2a8; --err:#e23; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#f3f5fb; color:#222; }
  .wrap { max-width:980px; margin:0 auto; padding:16px; }
  .topbar { background:linear-gradient(135deg,#ff9f43,#ffbe76); color:#fff; padding:18px 16px; border-radius:16px; margin-bottom:16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .topbar h1 { font-size:20px; }
  .topbar p { font-size:13px; opacity:.92; margin-top:4px; }
  .topbar-r { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
  .tb-btn { padding:7px 13px; border:none; border-radius:16px; background:rgba(255,255,255,.24); color:#fff; font-size:13px; cursor:pointer; font-weight:700; }
  .tb-btn:hover { background:rgba(255,255,255,.36); }
  @media (max-width:680px){ .topbar-r { margin-left:0; } }
  .card { background:#fff; border-radius:16px; padding:18px; margin-bottom:14px; box-shadow:0 4px 16px rgba(0,0,0,.05); }
  .layout { display:flex; gap:16px; align-items:flex-start; }
  .side { width:240px; flex-shrink:0; background:#fff; border-radius:16px; padding:14px; box-shadow:0 4px 16px rgba(0,0,0,.05); }
  .side h3 { font-size:13px; color:#999; margin-bottom:10px; font-weight:600; }
  .vol-item { padding:10px 12px; border-radius:12px; cursor:pointer; border:1.5px solid transparent; margin-bottom:6px; font-size:13px; }
  .vol-item:hover { background:#fff7f0; }
  .vol-item.on { background:#fff3e8; border-color:#ff9f43; }
  .vol-item .t { font-weight:700; font-size:13.5px; }
  .vol-item .s { font-size:11px; color:#999; margin-top:2px; }
  .logout { width:100%; margin-top:10px; padding:9px; border:none; border-radius:10px; background:#f0f0f0; color:#666; cursor:pointer; font-size:13px; }
  .logout.blue { background:#fff3e8; color:#ff9f43; font-weight:700; }
  .main { flex:1; min-width:0; }
  .empty { background:#fff; border-radius:16px; padding:70px 20px; text-align:center; color:#b0b0b0; font-size:15px; box-shadow:0 4px 16px rgba(0,0,0,.05); }
  .song-head { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:6px; }
  .song-emoji { font-size:44px; line-height:1; }
  .song-title { font-size:20px; font-weight:800; }
  .song-theme { font-size:12px; color:#ff9f43; background:#fff3e8; padding:3px 10px; border-radius:12px; font-weight:700; }
  .play-full { display:inline-flex; align-items:center; gap:8px; padding:12px 22px; border:none; border-radius:14px; background:linear-gradient(135deg,#ff9f43,#f77f2e); color:#fff; font-size:15px; font-weight:800; cursor:pointer; margin:10px 0 4px; }
  .play-full:active { transform:scale(.97); }
  .lyric { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:14px; cursor:pointer; margin-top:8px; border:1.5px solid #f0f0f0; transition:all .15s; }
  .lyric:hover { border-color:#ffbe76; background:#fffaf4; }
  .lyric.playing { border-color:#ff9f43; background:#fff3e8; }
  .lyric .idx { width:26px; height:26px; flex-shrink:0; border-radius:8px; background:#f5f5f5; color:#999; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .lyric.playing .idx { background:#ff9f43; color:#fff; }
  .lyric .en { flex:1; font-size:16.5px; font-weight:700; }
  .lyric .zh { font-size:13px; color:#888; margin-top:3px; }
  .lyric .btn { width:34px; height:34px; border:none; border-radius:50%; background:#fff3e8; color:#ff9f43; font-size:15px; cursor:pointer; flex-shrink:0; }
  .lyric.playing .btn { background:#ff9f43; color:#fff; }
  .wx-card { display:flex; align-items:center; gap:12px; flex-wrap:wrap; background:#fff; border:1px dashed #d8c98a; border-radius:10px; padding:10px 12px; font-size:13px; color:#444; }
  .wx-card b { color:#1a56db; font-size:15px; }
  .wx-card img { width:110px; height:auto; border-radius:8px; display:block; }
  .dev-note { font-size:12px; color:#999; margin-top:10px; padding-top:10px; border-top:1px dashed #eee; }
  @media (max-width:680px){ .layout { flex-direction:column; } .side { width:100%; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>🎵 幼儿儿歌磨耳朵</h1>
    <p>10 首韵律儿歌 · 真人旋律演唱 · 逐句点读（可理解性输入，慢速跟唱）</p>
    <div class="topbar-r"><button class="tb-btn" onclick="location.href='./index.html'">🏠 返回主页</button><button class="tb-btn" onclick="logout()">退出登录</button></div>
  </div>

  <div class="card" id="trialCard" style="display:none;border-left:4px solid #ffbe76">
    <b>🎁 体验模式</b>：当前可免费学 <b>第 1 首</b>。解锁幼儿英语模块后即可学习全部儿歌。<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px;" class="wx-card">需要解锁或购买，请添加管理员微信：<b style="color:#1a56db;font-size:15px;">13538237315</b><a href="./assets/admin-wechat-qr.jpg" target="_blank"><img src="./assets/admin-wechat-qr.jpg" alt="管理员微信二维码"></a></div>
  </div>

  <div class="layout" id="appLayout" style="display:none">
    <aside class="side">
      <h3>🎶 儿歌列表</h3>
      <div id="songMenu"></div>
      <button class="logout blue" onclick="location.href='./kids.html'">📖 单词听读背记</button>
      <button class="logout" onclick="location.href='./kids-listening.html'">🎧 听说练习</button>
      <div class="dev-note" id="acctNote"></div>
      <div class="dev-note" id="devNote"></div>
    </aside>
    <main class="main" id="mainArea">
      <div class="empty">← 从左侧选择一首儿歌开始</div>
    </main>
  </div>
</div>

<script>
const api = (u, opt) => fetch(u, opt).then(r => r.json().then(j => ({ s: r.status, j })));
let TOKEN = localStorage.getItem('token') || '';
function fp() {
  try {
    const c = document.createElement('canvas');
    const ctx = c.getContext('2d');
    ctx.textBaseline = 'top'; ctx.font = "14px 'Arial'";
    ctx.fillText('szgaokao-fp', 2, 2);
    const px = c.toDataURL();
    const s = [px, navigator.userAgent, navigator.language, (navigator.languages || []).join(','),
      screen.width + 'x' + screen.height + 'x' + screen.colorDepth, new Date().getTimezoneOffset(),
      navigator.hardwareConcurrency || 0, navigator.deviceMemory || 0].join('|');
    let h = 0x811c9dc5;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
    return ('0000000' + (h >>> 0).toString(16)).slice(-8);
  } catch (e) { return 'fp-fallback'; }
}
const DEVFP = (() => { try { let f = localStorage.getItem('devfp'); if (!f) { f = fp(); localStorage.setItem('devfp', f); } return f; } catch (e) { return fp(); } })();
const H = () => ({ 'Content-Type': 'application/json', 'X-Device': DEVFP, ...(TOKEN ? { Authorization: TOKEN } : {}) });
let DEV = { n: 0, max: 2 };
let ACCT = { username: '', expiry: null };
let AUTHED = false;
let TRIAL = false;
let SONGS = [];
let CUR = null;
let AUD = null;

function show(id, on) { const e = document.getElementById(id); if (e) e.style.display = on ? '' : 'none'; }
function logout() { TOKEN = ''; localStorage.removeItem('token'); location.href = './index.html'; }
function playAudio(src, el) {
  if (!src) return;
  if (AUD) AUD.pause();
  const a = el || new Audio(src);
  if (!el) { a.src = src; a.play(); }
  AUD = a;
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m])); }

async function showApp() {
  const an = document.getElementById('acctNote');
  if (an) {
    let exp;
    if (!AUTHED) exp = '体验模式（未授权）';
    else if (!ACCT.expiry) exp = '永久有效';
    else {
      const rem = Math.ceil((ACCT.expiry - Date.now()) / 864e5);
      exp = rem > 0 ? ('到期 ' + new Date(ACCT.expiry).toLocaleDateString() + '（剩 ' + rem + ' 天）') : ('已于 ' + new Date(ACCT.expiry).toLocaleDateString() + ' 到期');
    }
    an.innerHTML = '帐号 <b>' + esc(ACCT.username) + '</b><br>授权：' + exp;
  }
  const note = document.getElementById('devNote');
  if (note) note.innerHTML = `本账号已绑定设备 <b>${DEV.n}</b> / ${DEV.max} 台`;
  const r = await api('/api/kids-songs', { headers: H() });
  if (r.s !== 200) { document.getElementById('mainArea').innerHTML = '<div class="empty">加载失败：' + (r.j.error || '请返回主页重新登录') + '</div>'; return; }
  SONGS = r.j.songs || [];
  TRIAL = !!r.j.trial;
  document.getElementById('trialCard').style.display = TRIAL ? '' : 'none';
  show('appLayout', true);
  const m = document.getElementById('songMenu'); m.innerHTML = '';
  SONGS.forEach(s => {
    const d = document.createElement('div');
    d.className = 'vol-item'; d.id = 'song-' + s.id;
    d.innerHTML = '<div class="t">' + s.emoji + ' ' + esc(s.title) + '</div><div class="s">' + esc(s.theme) + ' · ' + s.lines + ' 句</div>';
    d.onclick = () => selectSong(s.id);
    m.appendChild(d);
  });
  if (SONGS.length) selectSong(SONGS[0].id);
}

function selectSong(id) {
  document.querySelectorAll('.vol-item').forEach(e => e.classList.remove('on'));
  const m = document.getElementById('song-' + id); if (m) m.classList.add('on');
  loadSong(id);
}

async function loadSong(id) {
  const ma = document.getElementById('mainArea');
  ma.innerHTML = '<div class="empty">加载中…</div>';
  const r = await api('/api/kids-songs?id=' + id, { headers: H() });
  if (r.s !== 200) { ma.innerHTML = '<div class="empty">加载失败：' + (r.j.error || '请返回主页重新登录') + '</div>'; return; }
  CUR = r.j;
  renderSong();
}

function renderSong() {
  const s = CUR;
  const ma = document.getElementById('mainArea');
  const lines = (s.lines || []).map((ln, i) => `
    <div class="lyric" id="ln-${i}" onclick="playLine(${i})">
      <div class="idx">${i + 1}</div>
      <div style="flex:1;min-width:0;">
        <div class="en">${esc(ln.en)}</div>
        <div class="zh">${esc(ln.zh)}</div>
      </div>
      <button class="btn">▶</button>
    </div>`).join('');
  ma.innerHTML = `
    <div class="card">
      <div class="song-head">
        <div class="song-emoji">${esc(s.emoji)}</div>
        <div style="flex:1;min-width:0;">
          <div class="song-title">${esc(s.title)} · ${esc(s.zhTitle)}</div>
          <div style="font-size:12px;color:#999;margin-top:4px;">主题：${esc(s.theme)} · 共 ${(s.lines || []).length} 句</div>
        </div>
        <span class="song-theme">${esc(s.theme)}</span>
      </div>
      <button class="play-full" onclick="playFull()">🎵 播放整首（真人演唱）</button>
      <div style="font-size:12px;color:#999;margin-top:6px;">💡 真人演唱：先跟着旋律哼唱 2 遍 → 逐句点读学发音 → 再把歌词唱出来，宝宝更容易开口</div>
    </div>
    <div class="card">
      <h3 style="font-size:14px;color:#999;margin-bottom:6px;">🎤 逐句跟唱（点句子播放）</h3>
      ${lines}
    </div>`;
  window.scrollTo({ top: 0 });
}

function playFull() {
  const s = CUR;
  if (!s || !s.fullAudio) return;
  if (AUD) AUD.pause();
  const a = new Audio(s.fullAudio);
  a.play();
  AUD = a;
}

function playLine(i) {
  const ln = CUR.lines[i];
  if (!ln) return;
  if (AUD) AUD.pause();
  const a = new Audio(ln.audio);
  a.play();
  AUD = a;
  document.querySelectorAll('.lyric').forEach(e => e.classList.remove('playing'));
  const el = document.getElementById('ln-' + i);
  if (el) el.classList.add('playing');
  setTimeout(() => { const el2 = document.getElementById('ln-' + i); if (el2) el2.classList.remove('playing'); }, Math.min(2600, 800 + ln.en.length * 120));
}

async function afterLogin() {
  const r = await api('/api/me', { headers: H() });
  if (r.s !== 200) { location.href = './index.html'; return; }
  DEV = { n: r.j.devices || 0, max: r.j.maxDevices || 2 };
  ACCT = { username: r.j.username || '', expiry: r.j.expiry || null };
  AUTHED = !!(r.j.modules || {}).kids;
  showApp();
}
if (TOKEN) afterLogin();
else {
  show('appLayout', true);
  document.getElementById('mainArea').innerHTML = '<div class="empty">请先登录：<a href="./index.html" style="color:#ff9f43;">前往登录页</a></div>';
}
</script>
<script>
(function(){try{var K='ksg';var s=JSON.parse(localStorage.getItem('study_log')||'{}');var e=s[K]||{last:0,times:0};e.last=Date.now();e.times=(e.times||0)+1;s[K]=e;localStorage.setItem('study_log',JSON.stringify(s));}catch(err){}}());
(function(){try{var t=localStorage.getItem('token')||'';if(!t)return;var d='';try{d=localStorage.getItem('devfp')||''}catch(e){}var body={log:{}};try{body.log=JSON.parse(localStorage.getItem('study_log')||'{}')}catch(e){}fetch('/api/study/sync',{method:'POST',headers:{'Content-Type':'application/json','X-Device':d,'Authorization':t},body:JSON.stringify(body)}).catch(function(){});}catch(err){}})();
</script>
</body>
</html>
