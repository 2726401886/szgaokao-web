<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学情报告 · szgaokao.科科通</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#f3f5fb; color:#222; }
  .wrap { max-width:960px; margin:0 auto; padding:16px; }
  .topbar { background:linear-gradient(135deg,#2a9d8f,#43aa8b); color:#fff; padding:18px 16px; border-radius:16px; margin-bottom:16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .topbar h1 { font-size:20px; }
  .topbar p { font-size:12.5px; opacity:.92; margin-top:3px; }
  .topbar .spacer { flex:1; }
  .topbar a.back { color:#fff; text-decoration:none; background:rgba(255,255,255,.22); padding:7px 14px; border-radius:20px; font-size:13px; }
  .card { background:#fff; border-radius:16px; padding:18px; margin-bottom:14px; box-shadow:0 4px 16px rgba(0,0,0,.05); }
  .sec-title { display:flex; align-items:center; gap:10px; margin:18px 0 10px; font-size:16px; font-weight:800; }
  .sec-title .bar { width:4px; height:16px; border-radius:2px; background:#2a9d8f; }
  .stats { display:flex; gap:12px; flex-wrap:wrap; }
  .stat { flex:1; min-width:150px; background:#f7fbfa; border:1.5px solid #e0f0ec; border-radius:14px; padding:16px; text-align:center; }
  .stat .n { font-size:30px; font-weight:800; color:#2a9d8f; }
  .stat .l { font-size:12.5px; color:#888; margin-top:4px; }
  .acct-row { display:flex; gap:24px; flex-wrap:wrap; font-size:13.5px; color:#555; margin-top:6px; }
  .acct-row b { color:#222; }
  .bar-row { display:flex; align-items:center; gap:10px; margin:8px 0; font-size:13px; }
  .bar-row .label { width:130px; flex-shrink:0; color:#555; }
  .bar-row .track { flex:1; height:18px; background:#f0f0f0; border-radius:9px; overflow:hidden; }
  .bar-row .fill { height:100%; background:linear-gradient(90deg,#2a9d8f,#43aa8b); border-radius:9px; }
  .bar-row .pct { width:56px; text-align:right; font-weight:700; color:#2a9d8f; }
  .trace-item { display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px dashed #f0f0f0; font-size:13.5px; }
  .trace-item .m { color:#555; font-weight:600; }
  .trace-item .t { color:#999; }
  .wl-item { padding:10px 12px; border:1.5px solid #fdecea; background:#fffafa; border-radius:12px; margin-bottom:8px; font-size:14px; }
  .wl-item .w { font-weight:800; }
  .wl-item .m { color:#666; margin-left:8px; font-size:13px; }
  .wl-item .play { margin-left:8px; padding:4px 10px; border:none; border-radius:8px; background:#2a9d8f; color:#fff; font-size:12px; cursor:pointer; }
  .empty2 { color:#aaa; font-size:13px; padding:20px 0; text-align:center; }
  .tip-box { background:#fffbe8; border:1px solid #f3e6b8; border-radius:12px; padding:14px 16px; font-size:13.5px; color:#7a5c00; line-height:1.8; }
  .tip-box li { margin-left:18px; }
  .print-btn { padding:10px 22px; border:none; border-radius:12px; background:#2a9d8f; color:#fff; font-size:14px; font-weight:700; cursor:pointer; }
  .wx-card { display:flex; align-items:center; gap:12px; flex-wrap:wrap; background:#fff; border:1px dashed #d8c98a; border-radius:10px; padding:10px 12px; font-size:13px; color:#444; }
  .wx-card b { color:#1a56db; font-size:15px; }
  .wx-card img { width:110px; height:auto; border-radius:8px; display:block; }
  .dev-note { font-size:12px; color:#999; margin-top:10px; padding-top:10px; border-top:1px dashed #eee; }
  .print-head { display:none; }
  @media print {
    .no-print { display:none !important; }
    body { background:#fff; }
    .wrap { max-width:100%; padding:0; }
    .print-head { display:block; font-size:15px; font-weight:800; color:#2a9d8f; padding:4px 0 10px; border-bottom:2px solid #2a9d8f; margin-bottom:12px; }
    .topbar { background:#fff; color:#222; border-radius:0; padding:0 0 8px; margin-bottom:12px; }
    .topbar h1 { color:#2a9d8f; font-size:19px; }
    .topbar p { color:#666; }
    .topbar a.back { display:none !important; }
    .card { box-shadow:none; border:1px solid #e4e4e4; border-radius:8px; padding:12px 14px; margin-bottom:10px; break-inside:avoid; page-break-inside:avoid; }
    .stat { background:#f7fbfa; border-color:#e0f0ec; }
    .bar-row .track { background:#eee; }
    .wl-item .play { display:none !important; }
    .dev-note { display:none !important; }
    .wx-card { display:none !important; }
    .trace-item { page-break-inside:avoid; }
    @page { margin: 14mm 12mm; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="print-head" id="printHead">科科通 · 学情报告</div>
  <div class="topbar">
    <div>
      <h1>📊 学情报告</h1>
      <p>词汇掌握 · 学习足迹 · 薄弱词回顾（数据自动记录于本设备）</p>
    </div>
    <div class="spacer"></div>
    <a class="back" href="./words.html">📖 小学单词</a>
    <a class="back" href="./index.html">← 返回主页</a>
  
    <a class="back" style="cursor:pointer;" onclick="logout()">退出登录</a></div>

  <div class="card">
    <div class="sec-title" style="margin-top:0;"><span class="bar"></span>账号信息</div>
    <div class="acct-row" id="acctInfo">加载中…</div>
    <div class="dev-note" id="devNote"></div>
  </div>

  <div class="card">
    <div class="sec-title" style="margin-top:0;"><span class="bar"></span>词汇掌握总览</div>
    <div class="stats" id="statsRow"><div class="stat"><div class="n">-</div><div class="l">已掌握单词</div></div><div class="stat"><div class="n">-</div><div class="l">词库总数</div></div><div class="stat"><div class="n">-</div><div class="l">掌握率</div></div></div>
    <div id="gradeBars" style="margin-top:16px;"></div>
  </div>

  <div class="card">
    <div class="sec-title" style="margin-top:0;"><span class="bar"></span>学习足迹</div>
    <div id="traceList"><div class="empty2">暂无明显学习记录，去体验一个模块吧</div></div>
    <div class="dev-note">足迹按设备本地记录，切换设备后以该设备记录为准。</div>
  </div>

  <div class="card">
    <div class="sec-title" style="margin-top:0;"><span class="bar"></span>听说练习总览（中考 / 高考）</div>
    <div class="stats" id="quizStats"><div class="stat"><div class="n">-</div><div class="l">中考练习卷数</div></div><div class="stat"><div class="n">-</div><div class="l">中考答题正确率</div></div><div class="stat"><div class="n">-</div><div class="l">高考完成套数</div></div></div>
    <div class="dev-note">答题记录自动同步云端，换设备后仍可查看。</div>
  </div>

  <div class="card">
    <div class="sec-title" style="margin-top:0;"><span class="bar"></span>薄弱词回顾（未掌握）</div>
    <div id="weakList"><div class="empty2">加载中…</div></div>
  </div>

  <div class="card">
    <div class="sec-title" style="margin-top:0;"><span class="bar"></span>复习建议</div>
    <div class="tip-box" id="tips"></div>
  </div>

  <div class="no-print" style="text-align:center;margin:6px 0 20px;">
    <button class="print-btn" onclick="window.print()">🖨 打印 / 导出 PDF 报告</button>
  </div>
</div>

<script>
function logout(){ try{localStorage.removeItem('token')}catch(e){} location.href='./index.html'; }

const api = (u, opt) => fetch(u, opt).then(r => r.json().then(j => ({ s: r.status, j })));
const TOKEN = localStorage.getItem('token') || '';
let DEVFP = '';
try { DEVFP = localStorage.getItem('devfp') || ''; } catch (e) {}
const H = () => ({ 'Content-Type': 'application/json', 'X-Device': DEVFP, ...(TOKEN ? { Authorization: TOKEN } : {}) });
const PROG_KEY = 'primary_words_progress';
const STUDY_KEY = 'study_log';
const KET_KEY = 'ket_words_progress';
const PET_KEY = 'pet_words_progress';
const QZ_KEY = 'quiz_progress';
const GK_KEY = 'gk_progress';
function loadQZ() { try { return JSON.parse(localStorage.getItem(QZ_KEY) || '{}'); } catch (e) { return {}; } }
function loadGK() { try { return JSON.parse(localStorage.getItem(GK_KEY) || '{}'); } catch (e) { return {}; } }
function loadProgK() { try { return JSON.parse(localStorage.getItem(KET_KEY) || '{}'); } catch (e) { return {}; } }
function loadProgP() { try { return JSON.parse(localStorage.getItem(PET_KEY) || '{}'); } catch (e) { return {}; } }
let AUD_CUR = null;

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m])); }
function playAudio(src) {
  if (!src) return;
  if (AUD_CUR) AUD_CUR.pause();
  const a = new Audio(src); a.play(); AUD_CUR = a;
}
function loadProg() { try { return JSON.parse(localStorage.getItem(PROG_KEY) || '{}'); } catch (e) { return {}; } }
function loadStudy() { try { return JSON.parse(localStorage.getItem(STUDY_KEY) || '{}'); } catch (e) { return {}; } }
async function mergeCloud() {
  try {
    if (!TOKEN) return;
    const r = await api('/api/study', { headers: H() });
    if (r.s !== 200 || !r.j) return;
    const clog = r.j.log || {};
    const s = loadStudy(); let cs = false;
    for (const k in clog) { if (!s[k] || (clog[k].last || 0) >= (s[k].last || 0)) { s[k] = clog[k]; cs = true; } }
    if (cs) localStorage.setItem(STUDY_KEY, JSON.stringify(s));
    const cp = r.j.progress || {};
    const p = loadProg(); let cpp = false;
    for (const k in cp) { if (!p[k] || (cp[k].t || 0) >= (p[k].t || 0)) { p[k] = cp[k]; cpp = true; } }
    if (cpp) localStorage.setItem(PROG_KEY, JSON.stringify(p));
  } catch (e) {}
}

async function mergeCloud() {
  try {
    if (!TOKEN) return;
    const r = await api('/api/study', { headers: H() });
    if (r.s !== 200 || !r.j) return;
    const clog = r.j.log || {};
    const s = loadStudy(); let cs = false;
    for (const k in clog) { if (!s[k] || (clog[k].last || 0) >= (s[k].last || 0)) { s[k] = clog[k]; cs = true; } }
    if (cs) localStorage.setItem(STUDY_KEY, JSON.stringify(s));
    const prog = r.j.progress || {};
    // 小学单词（兼容旧 flat 数据：无命名空间时整体视为 primary）
    let cloud = (prog.primary && typeof prog.primary === 'object') ? prog.primary : {};
    if (!prog.primary && !prog.ket && !prog.pet) cloud = prog;
    const p = loadProg(); let cpp = false;
    for (const k in cloud) { if (!p[k] || (cloud[k].t || 0) >= (p[k].t || 0)) { p[k] = cloud[k]; cpp = true; } }
    if (cpp) localStorage.setItem(PROG_KEY, JSON.stringify(p));
    // KET
    const ck = (prog.ket && typeof prog.ket === 'object') ? prog.ket : {};
    const pk = loadProgK(); let ckk = false;
    for (const k in ck) { if (!pk[k] || (ck[k].t || 0) >= (pk[k].t || 0)) { pk[k] = ck[k]; ckk = true; } }
    if (ckk) localStorage.setItem(KET_KEY, JSON.stringify(pk));
    // PET
    const cp2 = (prog.pet && typeof prog.pet === 'object') ? prog.pet : {};
    const pp = loadProgP(); let cpp2 = false;
    for (const k in cp2) { if (!pp[k] || (cp2[k].t || 0) >= (pp[k].t || 0)) { pp[k] = cp2[k]; cpp2 = true; } }
    if (cpp2) localStorage.setItem(PET_KEY, JSON.stringify(pp));
    // 中考答题（按卷聚合，t 新者胜）
    const cm = (prog.middle && typeof prog.middle === 'object') ? prog.middle : {};
    const pm = loadQZ(); let cpm = false;
    for (const k in cm) { if (!pm[k] || (cm[k]._last || 0) >= (pm[k]._last || 0)) { pm[k] = cm[k]; cpm = true; } }
    if (cpm) localStorage.setItem(QZ_KEY, JSON.stringify(pm));
    // 高考听说完成记录
    const cg = (prog.gk && typeof prog.gk === 'object') ? prog.gk : {};
    const pg = loadGK(); let cpg = false;
    for (const k in cg) { if (!pg[k] || (cg[k].last || 0) >= (pg[k].last || 0)) { pg[k] = cg[k]; cpg = true; } }
    if (cpg) localStorage.setItem(GK_KEY, JSON.stringify(pg));
  } catch (e) {}
}
function fmtTime(ts) {
  if (!ts) return '-';
  const d = new Date(ts);
  return d.toLocaleDateString('zh-CN', { month: 'numeric', day: 'numeric' }) + ' ' + d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
}
const MODULE_NAMES = {
  words: '📖 单词听读背记', phonics: '🔤 自然拼读', scenes: '💬 单词场景化', lt: '🎧 小学听说题库',
  exam: '📝 期末复习', longman: '📘 朗文同步', junior: '🚀 小升初衔接', reading: '📖 分级阅读',
  ket: '🎓 KET 备考', pet: '🎓 PET 备考', quiz: '🎧 中考听说', gk: '🎓 高考听说'
};

async function init() {
  await mergeCloud();
  // 账号
  const me = await api('/api/me', { headers: H() });
  if (me.s !== 200) { document.getElementById('acctInfo').innerHTML = '请先登录：<a href="./index.html" style="color:#2a9d8f;">前往登录页</a>'; return; }
  const m = me.j;
  let exp;
  if (!(m.modules || {}).primary && !(m.modules || {}).middle && !(m.modules || {}).gk) exp = '体验模式（未授权）';
  else if (!m.expiry) exp = '永久有效';
  else { const rem = Math.ceil((m.expiry - Date.now()) / 864e5); exp = rem > 0 ? ('到期 ' + new Date(m.expiry).toLocaleDateString() + '（剩 ' + rem + ' 天）') : '已到期'; }
  const ph = document.getElementById('printHead');
  if (ph) ph.innerHTML = '科科通 · 学情报告｜用户 ' + esc(m.username) + ' · ' + new Date().toLocaleDateString('zh-CN');
  document.getElementById('acctInfo').innerHTML =
    '用户名：<b>' + esc(m.username) + '</b>｜授权：' + exp +
    '｜已授权模块：<b>' + ['primary','middle','gk'].filter(k => (m.modules || {})[k]).map(k => ({ primary:'小学英语', middle:'中考英语', gk:'高考英语' }[k])).join('、') || '无' + '</b>';
  document.getElementById('devNote').innerHTML = '本账号已绑定设备 <b>' + (m.devices || 0) + '</b> / ' + (m.maxDevices || 2) + ' 台';

  // 词库（小学单词 + KET + PET）
  const [w, wk, wp] = await Promise.all([
    api('/api/words', { headers: H() }),
    api('/api/ket-words', { headers: H() }),
    api('/api/pet-words', { headers: H() })
  ]);
  const loadRows = (base, groups, progFn) => Promise.all(groups.map(g => api(base + '?group=' + g.id, { headers: H() }).then(r => ({ g, words: (r.s === 200 && r.j.words) || [], prog: progFn() }))));
  const rows = (await loadRows('/api/words', (w.s === 200 && w.j.groups) || [], loadProg))
    .concat(await loadRows('/api/ket-words', (wk.s === 200 && wk.j.groups) || [], loadProgK))
    .concat(await loadRows('/api/pet-words', (wp.s === 200 && wp.j.groups) || [], loadProgP));
  if (rows.length) {
    const mastered = rows.reduce((n, r) => n + r.words.filter(w2 => r.prog[w2.id] && r.prog[w2.id].m).length, 0);
    const total = rows.reduce((n, r) => n + r.words.length, 0);
    document.getElementById('statsRow').innerHTML =
      '<div class="stat"><div class="n">' + mastered + '</div><div class="l">已掌握单词</div></div>' +
      '<div class="stat"><div class="n">' + total + '</div><div class="l">词库总数</div></div>' +
      '<div class="stat"><div class="n">' + (total ? Math.round(mastered / total * 100) : 0) + '%</div><div class="l">掌握率</div></div>';
    // 按库/年级条形图
    const byGrade = {};
    rows.forEach(r => {
      const label = r.g.grade ? (r.g.grade + ' 年级') : (r.g.level || r.g.name || '其他');
      (byGrade[label] = byGrade[label] || []).push(r);
    });
    document.getElementById('gradeBars').innerHTML = Object.keys(byGrade).map(lb => {
      const rs = byGrade[lb];
      const t2 = rs.reduce((n, r) => n + r.words.length, 0);
      const mt = rs.reduce((n, r) => n + r.words.filter(w2 => r.prog[w2.id] && r.prog[w2.id].m).length, 0);
      const pct = t2 ? Math.round(mt / t2 * 100) : 0;
      return '<div class="bar-row"><div class="label">' + esc(lb) + '</div><div class="track"><div class="fill" style="width:' + pct + '%"></div></div><div class="pct">' + pct + '%</div></div>';
    }).join('');
    // 薄弱词（未掌握）按组
    const weakHtml = rows.map(r => {
      const uw = r.words.filter(w2 => !(r.prog[w2.id] && r.prog[w2.id].m));
      if (!uw.length) return '<div style="font-size:13px;color:#999;margin:8px 0;">✅ ' + esc(r.g.title) + ' 已全部掌握</div>';
      return '<div style="font-weight:700;font-size:14px;margin:12px 0 8px;">' + esc(r.g.title) + '（' + uw.length + ' 个未掌握）</div>' +
        uw.slice(0, 40).map(w2 => '<div class="wl-item"><span class="w">' + esc(w2.word) + '</span><span class="m">' + esc(w2.meaning) + '</span><button class="play" onclick="playAudio(\'' + w2.audio + '\')">🔊</button></div>').join('') +
        (uw.length > 40 ? '<div class="empty2">…还有 ' + (uw.length - 40) + ' 个，请到单词页继续练习</div>' : '');
    }).join('');
    document.getElementById('weakList').innerHTML = weakHtml || '<div class="empty2">暂无词库数据</div>';
  } else {
    document.getElementById('statsRow').innerHTML = '<div class="empty2" style="width:100%;">词库加载失败</div>';
  }

  // 学习足迹
  const study = loadStudy();
  const entries = Object.keys(study).map(k => ({ k, ...study[k] })).sort((a, b) => (b.last || 0) - (a.last || 0));
  if (entries.length) {
    document.getElementById('traceList').innerHTML = entries.slice(0, 8).map(e =>
      '<div class="trace-item"><span class="m">' + (MODULE_NAMES[e.k] || e.k) + '</span><span class="t">最近 ' + fmtTime(e.last) + (e.times ? ' · 进入 ' + e.times + ' 次' : '') + '</span></div>').join('');
  } else {
    document.getElementById('traceList').innerHTML = '<div class="empty2">暂无明显学习记录，去体验一个模块吧</div>';
  }

  // 听说练习总览（中考答题 + 高考完成）
  const qz = loadQZ();
  const qVols = Object.keys(qz).filter(k => (qz[k]._done || 0) > 0);
  const qDone = qVols.reduce((n, k) => n + (qz[k]._done || 0), 0);
  const qCorr = qVols.reduce((n, k) => n + (qz[k]._correct || 0), 0);
  const gkDone = Object.keys(loadGK()).filter(k => (loadGK()[k].done || 0) > 0).length;
  document.getElementById('quizStats').innerHTML =
    '<div class="stat"><div class="n">' + qVols.length + '</div><div class="l">中考练习卷数</div></div>' +
    '<div class="stat"><div class="n">' + (qDone ? Math.round(qCorr / qDone * 100) : 0) + '%</div><div class="l">中考答题正确率（' + qCorr + '/' + qDone + '）</div></div>' +
    '<div class="stat"><div class="n">' + gkDone + '</div><div class="l">高考完成套数</div></div>';

  // 建议
  const tips = [];
  if (entries.length) { const last = entries[0]; tips.push('最近学习：<b>' + (MODULE_NAMES[last.k] || last.k) + '</b>（' + fmtTime(last.last) + '）。建议保持每天 15-30 分钟，形成固定学习节奏。'); }
  tips.push('「听读背记」四步法：先听发音 → 跟读 3 遍 → 看义回忆 → 拼写检查，每词 1 分钟内完成。');
  tips.push('薄弱词建议用「听辨测试 / 背」模式反复过关；隔天再复习一遍，记忆更牢固。');
  tips.push('听说与期末卷按「先单词 → 短句 → 对话 → 篇章」顺序练习，逐步提升。');
  document.getElementById('tips').innerHTML = '<ol>' + tips.map(t => '<li>' + t + '</li>').join('') + '</ol>';
}
init();
</script>
</body>
</html>
