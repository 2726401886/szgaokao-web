<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>基础自检中心 · 科科通学情工作台</title>
<style>
  :root { --brand:#6a5cff; --brand2:#9b6cff; --ok:#2a8; --err:#e23; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#f3f5fb; color:#222; }
  .wrap { max-width:820px; margin:0 auto; padding:16px; }
  .topbar { background:linear-gradient(135deg,#6a5cff,#9b6cff); color:#fff; padding:18px 16px; border-radius:16px; margin-bottom:16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .topbar h1 { font-size:19px; }
  .topbar p { font-size:12.5px; opacity:.92; margin-top:3px; }
  .topbar-r { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
  .tb-btn { padding:7px 13px; border:none; border-radius:16px; background:rgba(255,255,255,.22); color:#fff; font-size:13px; cursor:pointer; font-weight:700; }
  .tb-btn:hover { background:rgba(255,255,255,.36); }
  .card { background:#fff; border-radius:16px; padding:18px; margin-bottom:14px; box-shadow:0 4px 16px rgba(0,0,0,.05); }
  .gtitle { font-size:16px; font-weight:800; margin-bottom:6px; }
  .ghint { font-size:12.5px; color:#999; margin-bottom:12px; line-height:1.6; }
  .lv-tabs { display:flex; gap:8px; margin-bottom:8px; }
  .lv-tabs button { flex:1; padding:11px; border:none; border-radius:12px; background:#eee; font-size:14px; cursor:pointer; font-weight:600; }
  .lv-tabs button.on { background:#6a5cff; color:#fff; }
  .cnt-tabs { display:flex; gap:8px; }
  .cnt-tabs button { flex:1; padding:10px; border:none; border-radius:12px; background:#eee; font-size:14px; cursor:pointer; }
  .cnt-tabs button.on { background:#efeaff; color:#6a5cff; font-weight:800; border:1.5px solid #6a5cff; }
  label.fld { display:block; font-size:13px; color:#666; font-weight:700; margin:16px 0 8px; }
  .tag-group { margin-bottom:10px; }
  .tag-gname { font-size:12.5px; color:#6a5cff; font-weight:700; margin-bottom:6px; }
  .chips { display:flex; flex-wrap:wrap; gap:7px; }
  .chip { padding:7px 12px; border:1.5px solid #e0e0e0; border-radius:12px; background:#fff; font-size:12.5px; cursor:pointer; user-select:none; }
  .chip.on { background:#efeaff; border-color:#6a5cff; color:#6a5cff; font-weight:700; }
  .mini-btn { padding:6px 12px; border:none; border-radius:10px; background:#efeaff; color:#6a5cff; font-weight:700; cursor:pointer; font-size:12.5px; }
  .btn { width:100%; padding:13px; border:none; border-radius:12px; background:#6a5cff; color:#fff; font-size:16px; font-weight:700; cursor:pointer; margin-top:18px; }
  .btn:hover { background:#5a4cf0; }
  .btn.gray { background:#f0f0f0; color:#999; }
  .btn.ghost { background:#fff; color:#6a5cff; border:1.5px solid #6a5cff; }
  .empty { background:#fff; border-radius:16px; padding:60px 20px; text-align:center; color:#b0b0b0; font-size:15px; }
  .q-box { background:#fff; border-radius:16px; padding:18px; box-shadow:0 4px 16px rgba(0,0,0,.05); }
  .q-head { display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .tag { display:inline-block; padding:3px 10px; border-radius:12px; font-size:12px; font-weight:700; background:#efeaff; color:#6a5cff; }
  .q-title { font-size:16px; font-weight:700; flex:1; min-width:160px; line-height:1.55; }
  .q-scene { max-width:100%; border-radius:10px; margin:10px 0; display:block; }
  .opt { padding:11px 14px; border:1.5px solid #eee; border-radius:10px; margin:8px 0; font-size:15px; cursor:pointer; transition:border-color .15s; display:flex; align-items:center; gap:10px; }
  .opt:hover { border-color:#6a5cff; }
  .opt.right { background:#e8f8ee; border-color:#2a8; }
  .opt.wrong { background:#fdecea; border-color:#e23; }
  .opt.locked { pointer-events:none; }
  .opt img { width:96px; height:96px; object-fit:contain; border-radius:8px; background:#fafafa; }
  .q-answer { font-size:14px; font-weight:700; margin-top:10px; }
  .q-tip { background:#fffbe8; padding:9px 12px; border-radius:10px; font-size:13px; color:#7a5c00; margin-top:10px; line-height:1.6; }
  .step { padding:6px 10px; border-left:3px solid #6a5cff; background:#f7f6ff; border-radius:8px; margin:6px 0; font-size:13px; line-height:1.65; }
  .step b { color:#6a5cff; }
  .q-foot { display:flex; gap:10px; margin-top:16px; }
  .q-foot button { flex:1; padding:12px; border:none; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; }
  .progress-wrap { background:#fff; border-radius:16px; padding:14px 18px; margin-bottom:14px; box-shadow:0 4px 16px rgba(0,0,0,.05); }
  .progress-bar { height:12px; background:#eee; border-radius:8px; overflow:hidden; margin-top:8px; }
  .progress-bar > div { height:100%; background:linear-gradient(90deg,#6a5cff,#9b6cff); width:0%; transition:width .3s; }
  .progress-meta { display:flex; justify-content:space-between; font-size:13px; color:#666; }
  .sum-num { font-size:34px; font-weight:800; color:#6a5cff; }
  .msg { font-size:13px; margin-top:10px; min-height:18px; }
  .msg.err { color:#e23; } .msg.ok { color:#2a8; }
  .dev-note { font-size:12px; color:#999; margin-top:10px; border-top:1px dashed #eee; padding-top:10px; }
  .linkrow { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
  .linkrow a { flex:1; min-width:140px; text-align:center; padding:11px; border-radius:12px; text-decoration:none; font-weight:700; font-size:14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>🔍 基础自检中心</h1>
    <p>选学段 · 随机抽题 · 即时判分 · 自动沉淀学情（自主学习辅助，不授课、不保分）</p>
    <div class="topbar-r"><button class="tb-btn" onclick="backHome()">🏠 主页</button><button class="tb-btn" onclick="logout()">退出登录</button></div>
  </div>

  <div id="gate" class="card" style="display:none">
    <div class="gtitle">请先登录</div>
    <div class="ghint">基础自检会记录你的逐题作答并沉淀到学情工作台，需登录后使用。</div>
    <a class="btn" href="./index.html" target="_top" style="display:block;text-align:center;text-decoration:none;">前往登录 / 注册</a>
  </div>

  <div id="config" class="card" style="display:none">
    <div class="gtitle">① 选择学段</div>
    <div class="lv-tabs" id="lvTabs">
      <button data-l="p" class="on" onclick="setLevel('p')">📘 小学数学</button>
      <button data-l="m" onclick="setLevel('m')">📗 初中数学</button>
      <button data-l="h" onclick="setLevel('h')">📙 高中数学</button>
    </div>
    <div class="ghint" id="trialNote"></div>

    <label class="fld">② 自检题量</label>
    <div class="cnt-tabs" id="cntTabs">
      <button data-c="5" onclick="setCount(5)">5 题</button>
      <button data-c="10" class="on" onclick="setCount(10)">10 题</button>
      <button data-c="15" onclick="setCount(15)">15 题</button>
    </div>

    <label class="fld">③ 按知识点组卷（可选，勾选知识点后只抽该类题；不勾则全部随机）</label>
    <div id="tagArea"></div>

    <button class="btn" id="startBtn" onclick="startCheck()">开始自检 →</button>
  </div>

  <div id="quiz" style="display:none">
    <div class="progress-wrap">
      <div class="progress-meta"><span id="pgText">第 1 题</span><span id="pgDone">已答 0</span></div>
      <div class="progress-bar"><div id="pgBar"></div></div>
    </div>
    <div id="qArea"></div>
  </div>

  <div id="summary" class="card" style="display:none">
    <div class="gtitle">🎉 自检完成</div>
    <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:12px 0;">
      <div class="sum-num" id="sumRight">0</div>
      <div style="font-size:13px;color:#666;line-height:1.7;">答对题数 / 总题数 <b id="sumTotal">0</b><br>正确率 <b id="sumRate">0%</b> · 用时 <b id="sumTime">0s</b></div>
    </div>
    <div class="ghint">点击「提交学情」把本次逐题作答写入账号，薄弱点 / 错题本 / 学习报告将据此生成（P2 看板上线后即可查看）。</div>
    <button class="btn" id="submitBtn" onclick="submitStudy()">提交学情 →</button>
    <div class="linkrow">
      <a class="btn ghost" href="./study.html" target="_top" style="text-decoration:none;">📊 学情工作台</a>
      <a class="btn gray" href="./index.html" target="_top" style="text-decoration:none;">🏠 返回主页</a>
    </div>
    <div class="msg" id="subMsg"></div>
  </div>

  <div class="dev-note" id="devNote"></div>
</div>

<script>
const api = (u, opt) => fetch(u, opt).then(r => r.json().then(j => ({ s: r.status, j })));
let TOKEN = localStorage.getItem('token') || '';
function fp() {
  try {
    const c = document.createElement('canvas'); const ctx = c.getContext('2d');
    ctx.textBaseline = 'top'; ctx.font = "14px 'Arial'"; ctx.fillText('szgaokao-fp', 2, 2);
    const px = c.toDataURL();
    const s = [px, navigator.userAgent, navigator.language, (navigator.languages||[]).join(','),
      screen.width+'x'+screen.height+'x'+screen.colorDepth, new Date().getTimezoneOffset(),
      navigator.hardwareConcurrency||0, navigator.deviceMemory||0].join('|');
    let h = 0x811c9dc5; for (let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193); }
    return ('0000000'+(h>>>0).toString(16)).slice(-8);
  } catch(e){ return 'fp-fallback'; }
}
const DEVFP = (() => { try { let f=localStorage.getItem('devfp'); if(!f){f=fp();localStorage.setItem('devfp',f);} return f; } catch(e){ return fp(); } })();
const H = () => ({ 'Content-Type':'application/json', 'X-Device':DEVFP, ...(TOKEN?{Authorization:TOKEN}:{}) });
const TAGTREE = {
  '数与代数':['有理数与实数','方程与不等式','函数','数列','指数对数'],
  '图形几何':['平面几何','立体几何','坐标与解析','图形变换','三角函数','解三角形'],
  '统计概率':['统计','概率'],
  '综合':['跨章节综合','实际应用情境'],
};

let LEVEL='p', COUNT=10, SELTAGS=new Set(), AUTHED=false, TRIAL=false, HABIT={}, CUR_REC=null;
let QZ=null, QIDX=0, RECORDS=[], SHOWN=0;

function $(id){ return document.getElementById(id); }
function show(id,on){ $(id).style.display = on ? '' : 'none'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function logout(){ TOKEN=''; localStorage.removeItem('token'); location.href='./index.html'; }
function backHome(){ location.href='./index.html'; }
function setLevel(l){ LEVEL=l; document.querySelectorAll('#lvTabs button').forEach(b=>b.className=(b.dataset.l===l?'on':'')); }
function setCount(c){ COUNT=c; document.querySelectorAll('#cntTabs button').forEach(b=>b.className=(+b.dataset.c===c?'on':'')); }

function renderTagChips(){
  const a=$('tagArea'); a.innerHTML='';
  for(const g in TAGTREE){
    const gd=document.createElement('div'); gd.className='tag-group';
    gd.innerHTML='<div class="tag-gname">'+esc(g)+'</div>';
    const cs=document.createElement('div'); cs.className='chips';
    TAGTREE[g].forEach(it=>{
      const key=g+'·'+it;
      const c=document.createElement('div'); c.className='chip'; c.textContent=it;
      c.onclick=()=>{ if(SELTAGS.has(key)){ SELTAGS.delete(key); c.className='chip'; } else { SELTAGS.add(key); c.className='chip on'; } };
      cs.appendChild(c);
    });
    gd.appendChild(cs); a.appendChild(gd);
  }
}

async function afterLogin(){
  const r=await api('/api/me',{headers:H()});
  if(r.s!==200){ logout(); return; }
  AUTHED = !!(r.j.modules && r.j.modules.math);
  TRIAL = !AUTHED;
  $('devNote').textContent = '本账号已绑定设备 '+(r.j.devices||0)+' / '+(r.j.maxDevices||2)+' 台';
  $('trialNote').textContent = TRIAL ? '当前为体验模式：自检仅抽取体验单元（免费），解锁数学模块后可抽全部单元。' : '已授权数学模块：可从全部单元随机抽题。';
  renderTagChips();
  show('gate',false); show('config',true);
}
function needLogin(){ show('gate',true); show('config',false); }

async function startCheck(){
  const r=await api('/api/selfcheck',{method:'POST',headers:H(),body:JSON.stringify({module:'math',level:LEVEL,count:COUNT,tags:Array.from(SELTAGS)})});
  if(r.s!==200){ alert(r.j.error||'抽取题目失败'); return; }
  QZ=r.j; QIDX=0; RECORDS=[]; HABIT={};
  show('config',false); show('quiz',true); show('summary',false);
  renderQuestion(0);
}

function renderQuestion(i){
  const qs=QZ.questions; const q=qs[i]; if(!q){ renderSummary(); return; }
  SHOWN=Date.now();
  if(!HABIT[QIDX]) HABIT[QIDX]=new Set();
  const ma=$('qArea');
  let html='<div class="q-box"><div class="q-head"><span class="tag">'+esc(q.type==='fill'?'填空题':(q.type==='judge'?'判断题':(q.type==='scene'?'应用题':'选择题')))+'</span><span class="q-title">'+esc(q.q)+'</span></div>';
  if(q.scene) html+='<img class="q-scene" src="'+esc(q.scene)+'" loading="lazy" decoding="async">';
  if(q.type==='fill'){
    html+='<div style="display:flex;gap:8px;margin:10px 0;"><input id="fillIn" type="text" placeholder="请输入答案" style="flex:1;padding:11px 14px;border:1.5px solid #eee;border-radius:10px;font-size:15px;" onkeydown="if(event.key===\'Enter\')submitFill()"><button onclick="submitFill()" style="padding:11px 18px;border:none;border-radius:10px;background:#6a5cff;color:#fff;font-weight:700;cursor:pointer;">提交</button></div><div id="resArea"></div>';
  } else {
    const opts=q.options||[]; const imgs=q.optionImgs||null;
    html+='<div id="optArea">';
    opts.forEach((o,ix)=>{
      const inner = (imgs && imgs[ix]) ? '<img src="'+esc(imgs[ix])+'" loading="lazy" decoding="async">' : esc(o);
      html+='<div class="opt" data-ix="'+ix+'" onclick="submitChoice('+ix+')">'+inner+'</div>';
    });
    html+='</div><div id="resArea"></div>';
  }
  const isLast = i>=qs.length-1;
  html+='<div class="q-foot"><button class="btn gray" onclick="quitCheck()">退出</button>'+(isLast?'<button class="btn" onclick="renderSummary()">完成自检</button>':'<button class="btn" onclick="nextQ()">下一题 →</button>')+'</div>';
  html+='</div>';
  ma.innerHTML=html;
  updateProg();
}
function updateProg(){
  $('pgText').textContent='第 '+(QIDX+1)+' / '+QZ.questions.length+' 题';
  const done=RECORDS.length; $('pgDone').textContent='已答 '+done;
  $('pgBar').style.width=(done/QZ.questions.length*100)+'%';
}

function normNum(a,b){
  const num=s=>{s=String(s).replace(/[^\d.\-]/g,'');if(s===''||s==='-'||s==='.')return null;const v=parseFloat(s);return isNaN(v)?null:v;};
  const na=num(a),nb=num(b); if(na!==null&&nb!==null) return Math.abs(na-nb)<1e-6; return false;
}
function submitFill(){
  const el=$('fillIn'); if(!el) return; let raw=el.value.trim(); if(raw===''){el.focus();return;}
  const q=QZ.questions[QIDX];
  const acc=[q.answer].concat(q.accept||[]).map(s=>String(s));
  const isOk = acc.indexOf(raw)>=0 || acc.some(a=>normNum(a,raw));
  record(q,isOk,-1,raw);
  const why=q.tip||'';
  $('resArea').innerHTML = (isOk?'<div class="q-answer" style="color:#2a8">✅ 答对了！</div>':'<div class="q-answer" style="color:#e23">❌ 答错了，正确答案：'+esc(q.answer)+'</div>') + (why?'<div class="q-tip">💡 '+esc(why)+'</div>':'');
  appendSteps(q);
  if(!isOk) appendHabitPicker(q.tags||[]);
  $('fillIn').disabled=true;
}
function submitChoice(ix){
  const q=QZ.questions[QIDX]; if($('resArea').innerHTML!=='') return;
  const isOk = (ix===q.answer);
  record(q,isOk,ix,null);
  const area=$('optArea'); if(area){ area.querySelectorAll('.opt').forEach(o=>{
    const oi=+o.dataset.ix; o.classList.add('locked');
    if(oi===q.answer) o.classList.add('right');
    else if(oi===ix) o.classList.add('wrong');
  }); }
  const why=q.tip||'';
  $('resArea').innerHTML = (isOk?'<div class="q-answer" style="color:#2a8">✅ 答对了！</div>':'<div class="q-answer" style="color:#e23">❌ 答错了，正确答案：第 '+(+q.answer+1)+' 项</div>') + (why?'<div class="q-tip">💡 '+esc(why)+'</div>':'');
  appendSteps(q);
  if(!isOk) appendHabitPicker(q.tags||[]);
}
function record(q,isOk,choice,raw){
  const ht = isOk ? [] : Array.from(HABIT[QIDX]||[]);
  RECORDS.push({ qid:q.qid, correct:isOk, choice:choice, time:Math.max(0,Date.now()-SHOWN), tags:(q.tags||[]).concat(ht) });
  CUR_REC = RECORDS[RECORDS.length-1];
}
function appendHabitPicker(qtags){
  const box=document.createElement('div'); box.style.marginTop='10px';
  box.innerHTML='<div style="font-size:12.5px;color:#ff5e62;font-weight:700;margin-bottom:6px;">这道题为什么错？（可选，用于「习惯薄弱点」分析）</div><div class="chips" id="habitBox"></div>';
  $('resArea').appendChild(box);
  const hb=box.querySelector('#habitBox');
  ['审题漏看','计算马虎','单位换算','概念混淆'].forEach(function(name){
    const c=document.createElement('div'); c.className='chip'; c.textContent=name;
    c.onclick=function(){ const key='跨模块·'+name; const s=HABIT[QIDX]||(HABIT[QIDX]=new Set()); if(s.has(key)){ s.delete(key); c.className='chip'; } else { s.add(key); c.className='chip on'; }
      if(CUR_REC) CUR_REC.tags = (qtags||[]).concat(Array.from(s)); };
    hb.appendChild(c);
  });
}
function appendSteps(q){
  if(!q || !q.steps || !q.steps.length) return;
  const box=document.createElement('div'); box.style.marginTop='10px';
  box.innerHTML='<button class="mini-btn" onclick="toggleStepsBox(this)">📝 分步解题</button><div class="steps-box" style="display:none;margin-top:8px;">'+
    q.steps.map(function(s,i){ return '<div class="step"><b>'+(s.title||('第'+(i+1)+'步'))+'</b>：'+esc(s.detail)+'</div>'; }).join('')+
    '</div>';
  const ra=$('resArea'); if(ra) ra.appendChild(box);
}
function toggleStepsBox(btn){ const b=btn.nextElementSibling; if(b){ b.style.display = (b.style.display==='none'?'block':'none'); } }
function nextQ(){ if(QIDX<QZ.questions.length-1){ QIDX++; renderQuestion(QIDX); } else renderSummary(); }
function quitCheck(){ if(confirm('退出本次自检？已作答记录将不会提交。')){ show('quiz',false); show('config',true); } }

function renderSummary(){
  show('quiz',false); show('summary',true);
  const total=RECORDS.length, right=RECORDS.filter(r=>r.correct).length;
  const t=RECORDS.reduce((s,r)=>s+r.time,0);
  $('sumRight').textContent=right; $('sumTotal').textContent=total;
  $('sumRate').textContent=(total?Math.round(right/total*100):0)+'%';
  $('sumTime').textContent=Math.round(t/1000)+'s';
}
async function submitStudy(){
  const r=await api('/api/study/sync',{method:'POST',headers:H(),body:JSON.stringify({ans:RECORDS})});
  if(r.s===200){ $('subMsg').className='msg ok'; $('subMsg').textContent='✅ 学情已提交，本次 '+RECORDS.length+' 题作答已沉淀到账号。'; $('submitBtn').disabled=true; }
  else { $('subMsg').className='msg err'; $('subMsg').textContent=(r.j&&r.j.error)||'提交失败'; }
}

if(TOKEN) afterLogin(); else needLogin();
</script>
</body>
</html>
