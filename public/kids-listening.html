<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幼儿启蒙英语听说</title>
<style>
  :root { --brand:#ff9f43; --brand2:#ffbe76; --ok:#2a8; --err:#e23; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#f3f5fb; color:#222; }
  .wrap { max-width:980px; margin:0 auto; padding:16px; }
  .topbar { background:linear-gradient(135deg,#ff9f43,#ffbe76); color:#fff; padding:18px 16px; border-radius:16px; margin-bottom:16px; }
  .topbar h1 { font-size:20px; }
  .topbar p { font-size:13px; opacity:.92; margin-top:4px; }
  .card { background:#fff; border-radius:16px; padding:18px; margin-bottom:14px; box-shadow:0 4px 16px rgba(0,0,0,.05); }
  .layout { display:flex; gap:16px; align-items:flex-start; }
  .side { width:240px; flex-shrink:0; background:#fff; border-radius:16px; padding:14px; box-shadow:0 4px 16px rgba(0,0,0,.05); }
  .side h3 { font-size:13px; color:#999; margin-bottom:10px; font-weight:600; }
  .vol-item { padding:10px 12px; border-radius:12px; cursor:pointer; border:1.5px solid transparent; margin-bottom:6px; font-size:13px; }
  .vol-item:hover { background:#fff7f0; }
  .vol-item.on { background:#fff3e8; border-color:#ff9f43; }
  .vol-item .t { font-weight:700; font-size:13.5px; }
  .vol-item .s { font-size:11px; color:#999; margin-top:2px; }
  .logout { width:100%; margin-top:10px; padding:9px; border:none; border-radius:10px; background:#f0f0f0; color:#666; cursor:pointer; font-size:13px; }
  .logout.blue { background:#fff3e8; color:#ff9f43; font-weight:700; }
  .main { flex:1; min-width:0; }
  .empty { background:#fff; border-radius:16px; padding:70px 20px; text-align:center; color:#b0b0b0; font-size:15px; box-shadow:0 4px 16px rgba(0,0,0,.05); }
  .q-box { background:#fff; border-radius:16px; padding:18px; box-shadow:0 4px 16px rgba(0,0,0,.05); margin-bottom:14px; }
  .q-head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .tag { display:inline-block; padding:3px 10px; border-radius:12px; font-size:12px; font-weight:700; }
  .tag.word { background:#fff3e8; color:#ff9f43; }
  .tag.sentence { background:#eef3ff; color:#1a56db; }
  .tag.dialogue { background:#e8f8ee; color:#2a8; }
  .tag.passage { background:#f4eefb; color:#8a4fd3; }
  .tag.speaking { background:#fff7e0; color:#b8860b; }
  .q-title { font-size:14.5px; font-weight:700; flex:1; min-width:160px; }
  .audio-btn { display:inline-block; padding:8px 14px; border:none; border-radius:10px; background:#ff9f43; color:#fff; font-size:13px; cursor:pointer; font-weight:700; }
  .opt { padding:11px 14px; border:1.5px solid #eee; border-radius:10px; margin:8px 0; font-size:15px; cursor:pointer; transition:border-color .15s; }
  .opt:hover { border-color:#ff9f43; }
  .opt.right { background:#e8f8ee; border-color:#2a8; }
  .opt.wrong { background:#fdecea; border-color:#e23; }
  .opt.locked { pointer-events:none; }
  .q-answer { font-size:14px; font-weight:700; color:#2a8; margin-top:10px; }
  .q-tip { background:#fff7e0; padding:9px 12px; border-radius:10px; font-size:13px; color:#7a5c00; margin-top:10px; line-height:1.6; }
  .speak-box { background:#fff8f7; border:1.5px solid #ffe3e0; border-radius:12px; padding:14px 16px; }
  .speak-box .tx { font-size:17px; font-weight:700; }
  .speak-box .ref { font-size:13px; color:#888; margin-top:6px; }
  .speak-box .play { margin-top:12px; }
  .nav-bar { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0; }
  .nav-q { width:38px; height:38px; border-radius:10px; border:1.5px solid #e0e0e0; background:#fff; color:#666; font-size:14px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .15s; }
  .nav-q:hover { border-color:#ff9f43; color:#ff9f43; }
  .nav-q.on { background:#ff9f43; border-color:#ff9f43; color:#fff; }
  .nav-q.done { background:#e8f8ee; border-color:#2a8; color:#2a8; }
  .nav-foot { display:flex; gap:10px; justify-content:space-between; margin-top:16px; }
  .nav-foot button { flex:1; padding:12px; border:none; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; }
  .btn-prev { background:#f0f0f0; color:#666; }
  .btn-prev:hover { background:#e8e8e8; }
  .btn-next { background:#ff9f43; color:#fff; }
  .btn-next:hover { background:#f04d51; }
  .nav-count { text-align:center; font-size:12px; color:#999; margin-top:8px; }
  .sub-q { border-top:1px dashed #eee; margin-top:12px; padding-top:12px; }
  .sub-q .st { font-size:13.5px; font-weight:700; margin-bottom:4px; }
  .dev-note { font-size:12px; color:#999; margin-top:10px; padding-top:10px; border-top:1px dashed #eee; }
  .wx-card { display:flex; align-items:center; gap:12px; flex-wrap:wrap; background:#fff; border:1px dashed #d8c98a; border-radius:10px; padding:10px 12px; font-size:13px; color:#444; }
  .wx-card b { color:#1a56db; font-size:15px; }
  .wx-card img { width:110px; height:auto; border-radius:8px; display:block; }
  @media (max-width:680px){
    .layout { flex-direction:column; }
    .side { width:100%; }
  }

  .topbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .topbar-r { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
  .tb-btn { padding:7px 13px; border:none; border-radius:16px; background:rgba(255,255,255,.24); color:#fff; font-size:13px; cursor:pointer; font-weight:700; }
  .tb-btn:hover { background:rgba(255,255,255,.36); }
  @media (max-width:680px){ .topbar-r { margin-left:0; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>🎧 幼儿启蒙听说</h1>
    <p>单词听力 · 短句听力 · 日常问答（英音慢速 · 3–6 岁启蒙）</p>
  <div class="topbar-r"><button class="tb-btn" onclick="location.href='./index.html'">🏠 返回主页</button><button class="tb-btn" onclick="logout()">退出登录</button></div>
  </div>

  <div class="card" id="trialCard" style="display:none;border-left:4px solid #ffbe76">
    <b>🎁 体验模式</b>：当前可免费练习 <b>第 1 卷</b>。解锁幼儿英语模块后即可练习全部试卷。<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px;" class="wx-card">需要解锁或购买，请添加管理员微信：<b style="color:#1a56db;font-size:15px;">13538237315</b><a href="./assets/admin-wechat-qr.jpg" target="_blank"><img src="./assets/admin-wechat-qr.jpg" alt="管理员微信二维码"></a></div>
  </div>

  <div class="layout" id="appLayout" style="display:none">
    <aside class="side">
      <h3>🧸 听说练习</h3>
      <div id="volMenu"></div>
      <button class="logout blue" onclick="location.href='./kids.html'">📖 单词听读背记</button>
      <div class="dev-note" id="acctNote"></div>
      <div class="dev-note" id="devNote"></div>
    </aside>
    <main class="main" id="mainArea">
      <div class="empty">← 从左侧选择一份听说试卷开始练习</div>
    </main>
  </div>
</div>

<script>
const api = (u, opt) => fetch(u, opt).then(r => r.json().then(j => ({ s: r.status, j })));
let TOKEN = localStorage.getItem('token') || '';

function fp() {
  try {
    const c = document.createElement('canvas');
    const ctx = c.getContext('2d');
    ctx.textBaseline = 'top'; ctx.font = "14px 'Arial'";
    ctx.fillText('szgaokao-fp', 2, 2);
    const px = c.toDataURL();
    const s = [px, navigator.userAgent, navigator.language, (navigator.languages || []).join(','),
      screen.width + 'x' + screen.height + 'x' + screen.colorDepth, new Date().getTimezoneOffset(),
      navigator.hardwareConcurrency || 0, navigator.deviceMemory || 0].join('|');
    let h = 0x811c9dc5;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
    return ('0000000' + (h >>> 0).toString(16)).slice(-8);
  } catch (e) { return 'fp-fallback'; }
}
const DEVFP = (() => { try { let f = localStorage.getItem('devfp'); if (!f) { f = fp(); localStorage.setItem('devfp', f); } return f; } catch (e) { return fp(); } })();
const H = () => ({ 'Content-Type': 'application/json', 'X-Device': DEVFP, ...(TOKEN ? { Authorization: TOKEN } : {}) });

let DEV = { n: 0, max: 2 };
let ACCT = { username: '', expiry: null };
let AUTHED = false;
let TRIAL = false;
let VOLS = [];          // [{id,title,grade,topic,count}]
let CUR = null;         // 当前卷完整数据
let answered = {};      // qid -> 选中下标
let cur = 0;            // 当前题索引（单题视图）
let AUD_CUR = null;     // 全局单源播放（音频互斥）

function show(id, on) { const e = document.getElementById(id); if (e) e.style.display = on ? '' : 'none'; }
function logout() { TOKEN = ''; localStorage.removeItem('token'); location.href = './index.html'; }
function playAudio(src, el) {
  if (!src) return;
  if (AUD_CUR && AUD_CUR !== el) AUD_CUR.pause();
  const a = el || new Audio(src);
  if (!el) { a.src = src; a.play(); }
  AUD_CUR = a;
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m])); }
const TAG = { word: ['word', '单词听力'], sentence: ['sentence', '短句听力'] };

async function showApp() {
  const an = document.getElementById('acctNote');
  if (an) {
    let exp;
    if (!AUTHED) exp = '体验模式（未授权）';
    else if (!ACCT.expiry) exp = '永久有效';
    else {
      const rem = Math.ceil((ACCT.expiry - Date.now()) / 864e5);
      exp = rem > 0 ? ('到期 ' + new Date(ACCT.expiry).toLocaleDateString() + '（剩 ' + rem + ' 天）') : ('已于 ' + new Date(ACCT.expiry).toLocaleDateString() + ' 到期');
    }
    an.innerHTML = '帐号 <b>' + esc(ACCT.username) + '</b><br>授权：' + exp;
  }
  const note = document.getElementById('devNote');
  if (note) note.innerHTML = `本账号已绑定设备 <b>${DEV.n}</b> / ${DEV.max} 台`;
  const r = await api('/api/kids-listening', { headers: H() });
  if (r.s !== 200) { document.getElementById('mainArea').innerHTML = '<div class="empty">加载失败：' + (r.j.error || '请返回主页重新登录') + '</div>'; return; }
  VOLS = r.j.volumes || [];
  TRIAL = !!r.j.trial;
  document.getElementById('trialCard').style.display = TRIAL ? '' : 'none';
  show('appLayout', true);
  const m = document.getElementById('volMenu'); m.innerHTML = '';
  VOLS.forEach(v => {
    const d = document.createElement('div');
    d.className = 'vol-item'; d.id = 'vol-' + v.id;
    const gl = v.grade ? ('Grade ' + v.grade + ' · ') : '';
    d.innerHTML = '<div class="t">' + esc(v.title) + '</div><div class="s">' + gl + (v.count || 0) + ' 题</div>';
    d.onclick = () => selectVol(v.id);
    m.appendChild(d);
  });
  if (VOLS.length) selectVol(VOLS[0].id);
}

function selectVol(id) {
  document.querySelectorAll('.vol-item').forEach(e => e.classList.remove('on'));
  const m = document.getElementById('vol-' + id); if (m) m.classList.add('on');
  loadVol(id);
}

async function loadVol(id) {
  const ma = document.getElementById('mainArea');
  ma.innerHTML = '<div class="empty">加载中…</div>';
  const r = await api('/api/kids-listening?vol=' + id, { headers: H() });
  if (r.s !== 200) { ma.innerHTML = '<div class="empty">加载失败：' + (r.j.error || '请返回主页重新登录') + '</div>'; return; }
  CUR = r.j;
  answered = {};
  cur = 0;
  renderVol();
}

function renderVol() {
  const v = CUR;
  const ma = document.getElementById('mainArea');
  const qs = v.questions || [];
  cur = Math.min(cur, Math.max(0, qs.length - 1));
  const doneSet = {};
  qs.forEach((q, i) => {
    if (q.type === 'speaking') return;
    if (q.type === 'passage') {
      const subs = q.questions || [];
      if (subs.length && subs.every((sub, si) => answered[q.id + '-' + si] != null)) doneSet[i] = 1;
    } else if (answered[q.id] != null) doneSet[i] = 1;
  });
  const nav = qs.map((q, i) =>
    `<div class="nav-q ${i === cur ? 'on' : ''} ${doneSet[i] ? 'done' : ''}" onclick="goTo(${i})">${i + 1}</div>`).join('');
  ma.innerHTML = `
    <div class="card">
      <h2 style="font-size:18px;">${esc(v.title)}</h2>
      <div style="font-size:12px;color:#999;margin-top:4px;">${esc(v.topic || '')} · 共 ${qs.length} 题</div>
      <div class="nav-bar">${nav}</div>
      <div class="nav-count">${qs.length} 题 · 绿色 = 已作答</div>
    </div>
    <div id="qArea"></div>
    <div class="nav-foot">
      <button class="btn-prev" onclick="prevQ()" ${cur === 0 ? 'disabled style="opacity:.4"' : ''}>← 上一题</button>
      <button class="btn-next" onclick="nextQ()" ${cur >= qs.length - 1 ? 'disabled style="opacity:.4"' : ''}>下一题 →</button>
    </div>`;
  renderCurrent();
  window.scrollTo({ top: 0 });
}

function renderCurrent() {
  const qs = CUR.questions || [];
  const q = qs[cur];
  const ma = document.getElementById('qArea');
  if (!q) { ma.innerHTML = '<div class="empty">暂无题目</div>'; return; }
  ma.innerHTML = renderQ(q, cur + 1);
  const nav = document.querySelectorAll('.nav-q');
  nav.forEach((e, i) => { e.classList.toggle('on', i === cur); });
}

function goTo(i) {
  const qs = CUR.questions || [];
  if (i < 0 || i >= qs.length) return;
  cur = i;
  renderCurrent();
  window.scrollTo({ top: 0 });
}
function prevQ() { goTo(cur - 1); }
function nextQ() { goTo(cur + 1); }

function renderQ(q, n) {
  const t = TAG[q.type] || ['', q.type];
  if (q.type === 'speaking') {
    return `
      <div class="q-box" id="qb-${q.id}">
        <div class="q-head"><span class="tag ${t[0]}">${t[1]}</span><span class="q-title">第 ${n} 题 · ${esc(q.q)}</span></div>
        <div class="speak-box">
          <div class="tx">${esc(q.text)}</div>
          <div class="ref">📖 ${esc(q.ref)}</div>
          <button class="audio-btn play" onclick="playAudio('${q.audio}')">🔊 听示范</button>
        </div>
      </div>`;
  }
  if (q.type === 'passage') {
    const subs = (q.questions || []).map((sub, si) => {
      const key = q.id + '-' + si;
      const sel = answered[key];
      const opts = sub.options.map((o, oi) => {
        let cls = 'opt';
        if (sel != null) {
          cls += ' locked';
          if (oi === sub.answer) cls += ' right';
          else if (oi === sel) cls += ' wrong';
        }
        return `<div class="${cls}" onclick="pickSub('${q.id}', ${si}, ${oi})">${String.fromCharCode(65 + oi)}. ${esc(o)}</div>`;
      }).join('');
      const res = sel != null ? `<div class="q-answer">✅ 正确答案：${String.fromCharCode(65 + sub.answer)}. ${esc(sub.options[sub.answer])}</div><div class="q-tip">💡 ${esc(sub.tip)}</div>` : '';
      return `<div class="sub-q"><div class="st">第 ${si + 1} 小题：${esc(sub.q2)}</div>${opts}${res}</div>`;
    }).join('');
    return `
      <div class="q-box" id="qb-${q.id}">
        <div class="q-head"><span class="tag ${t[0]}">${t[1]}</span><span class="q-title">第 ${n} 题 · ${esc(q.q)}</span></div>
        <button class="audio-btn" onclick="playAudio('${q.audio}')">🔊 播放短文</button>
        ${subs}
      </div>`;
  }
  const key = q.id;
  const sel = answered[key];
  const opts = q.options.map((o, oi) => {
    let cls = 'opt';
    if (sel != null) {
      cls += ' locked';
      if (oi === q.answer) cls += ' right';
      else if (oi === sel) cls += ' wrong';
    }
    return `<div class="${cls}" onclick="pick('${q.id}', ${oi})">${String.fromCharCode(65 + oi)}. ${esc(o)}</div>`;
  }).join('');
  const res = sel != null ? `<div class="q-answer">✅ 正确答案：${String.fromCharCode(65 + q.answer)}. ${esc(q.options[q.answer])}</div><div class="q-tip">💡 ${esc(q.tip)}</div>` : '';
  const sub = q.type === 'dialogue' ? `<div class="q-tip" style="margin-top:4px;">❓ ${esc(q.q2)}</div>` : '';
  return `
    <div class="q-box" id="qb-${q.id}">
      <div class="q-head"><span class="tag ${t[0]}">${t[1]}</span><span class="q-title">第 ${n} 题 · ${esc(q.q)}</span></div>
      <button class="audio-btn" onclick="playAudio('${q.audio}')">🔊 播放</button>
      ${sub}
      ${opts}
      ${res}
    </div>`;
}

function pick(qid, i) {
  if (answered[qid] != null) return;
  answered[qid] = i;
  renderCurrent();
  markDone();
}
function pickSub(qid, si, i) {
  const key = qid + '-' + si;
  if (answered[key] != null) return;
  answered[key] = i;
  renderCurrent();
  markDone();
}
function markDone() {
  const qs = CUR.questions || [];
  qs.forEach((q, idx) => {
    let done = false;
    if (q.type === 'speaking') return;
    if (q.type === 'passage') {
      const subs = q.questions || [];
      done = subs.length && subs.every((sub, si) => answered[q.id + '-' + si] != null);
    } else done = answered[q.id] != null;
    const e = document.querySelectorAll('.nav-q')[idx];
    if (e && done) e.classList.add('done');
  });
}

async function afterLogin() {
  const r = await api('/api/me', { headers: H() });
  if (r.s !== 200) { location.href = './index.html'; return; }
  DEV = { n: r.j.devices || 0, max: r.j.maxDevices || 2 };
  ACCT = { username: r.j.username || '', expiry: r.j.expiry || null };
  AUTHED = !!(r.j.modules || {}).kids;
  showApp();
}
if (TOKEN) afterLogin();
else {
  show('appLayout', true);
  document.getElementById('mainArea').innerHTML = '<div class="empty">请先登录：<a href="./index.html" style="color:#ff9f43;">前往登录页</a></div>';
}
</script>
<script>
(function(){try{var K='klt';var s=JSON.parse(localStorage.getItem('study_log')||'{}');var e=s[K]||{last:0,times:0};e.last=Date.now();e.times=(e.times||0)+1;s[K]=e;localStorage.setItem('study_log',JSON.stringify(s));}catch(err){}}());
(function(){try{var t=localStorage.getItem('token')||'';if(!t)return;var d='';try{d=localStorage.getItem('devfp')||''}catch(e){}var body={log:{},progress:{}};try{body.log=JSON.parse(localStorage.getItem('study_log')||'{}')}catch(e){}try{body.progress=JSON.parse(localStorage.getItem('kids_words_progress')||'{}')}catch(e){}fetch('/api/study/sync',{method:'POST',headers:{'Content-Type':'application/json','X-Device':d,'Authorization':t},body:JSON.stringify(body)}).catch(function(){});}catch(err){}})();
</script>
</body>
</html>
